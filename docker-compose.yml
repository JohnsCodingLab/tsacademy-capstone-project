version: "3.9"

# ─── Named volumes ─────────────────────────────────────────────────────────────
# Data persists across container restarts. Remove with: docker-compose down -v

volumes:
    postgres_data:
    redis_data:

# ─── Networks ──────────────────────────────────────────────────────────────────

networks:
    sisms_net:
        driver: bridge

# ─── Services ──────────────────────────────────────────────────────────────────

services:
    # ── PostgreSQL ────────────────────────────────────────────────────────────────
    postgres:
        image: postgres:16-alpine
        container_name: sisms_postgres
        restart: unless-stopped
        environment:
            POSTGRES_USER: ${POSTGRES_USER:-sisms}
            POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-sisms_secret}
            POSTGRES_DB: ${POSTGRES_DB:-sisms_db}
        volumes:
            - postgres_data:/var/lib/postgresql/data
        ports:
            - "${POSTGRES_PORT:-5432}:5432"
        healthcheck:
            test:
                [
                    "CMD-SHELL",
                    "pg_isready -U ${POSTGRES_USER:-sisms} -d ${POSTGRES_DB:-sisms_db}",
                ]
            interval: 10s
            timeout: 5s
            retries: 5
            start_period: 10s
        networks:
            - sisms_net

    # ── Redis ─────────────────────────────────────────────────────────────────────
    redis:
        image: redis:7-alpine
        container_name: sisms_redis
        restart: unless-stopped
        command: redis-server --appendonly yes --requirepass ${REDIS_PASSWORD:-redis_secret}
        volumes:
            - redis_data:/data
        ports:
            - "${REDIS_PORT:-6379}:6379"
        healthcheck:
            test:
                [
                    "CMD",
                    "redis-cli",
                    "-a",
                    "${REDIS_PASSWORD:-redis_secret}",
                    "ping",
                ]
            interval: 10s
            timeout: 5s
            retries: 5
            start_period: 5s
        networks:
            - sisms_net

    # ── API Server ────────────────────────────────────────────────────────────────
    api:
        build:
            context: .
            dockerfile: Dockerfile
            target: production
        container_name: sisms_api
        restart: unless-stopped
        depends_on:
            postgres:
                condition: service_healthy
            redis:
                condition: service_healthy
        environment:
            NODE_ENV: production
            PORT: 5000

            DATABASE_URL: postgresql://${POSTGRES_USER:-sisms}:${POSTGRES_PASSWORD:-sisms_secret}@postgres:5432/${POSTGRES_DB:-sisms_db}
            REDIS_URL: redis://:${REDIS_PASSWORD:-redis_secret}@redis:6379

            ORG_JWT_SECRET: ${ORG_JWT_SECRET}
            ORG_JWT_REFRESH_SECRET: ${ORG_JWT_REFRESH_SECRET}
            SYSTEM_JWT_SECRET: ${SYSTEM_JWT_SECRET}
            SYSTEM_JWT_REFRESH_SECRET: ${SYSTEM_JWT_REFRESH_SECRET}
            JWT_ACCESS_EXPIRATION: ${JWT_ACCESS_EXPIRATION:-15m}
            JWT_REFRESH_EXPIRATION: ${JWT_REFRESH_EXPIRATION:-7d}

            SMTP_HOST: ${SMTP_HOST}
            SMTP_PORT: ${SMTP_PORT:-587}
            SMTP_SECURE: ${SMTP_SECURE:-false}
            SMTP_USER: ${SMTP_USER}
            SMTP_PASS: ${SMTP_PASS}
            SMTP_FROM: ${SMTP_FROM:-S.I.S.M.S <no-reply@sisms.com>}

            FRONTEND_URL: ${FRONTEND_URL:-http://localhost:3000}
        ports:
            - "${API_PORT:-5000}:5000"
        healthcheck:
            test:
                [
                    "CMD-SHELL",
                    "wget -qO- http://localhost:5000/health || exit 1",
                ]
            interval: 15s
            timeout: 5s
            retries: 3
            start_period: 20s
        networks:
            - sisms_net

    # ── DB Migrations (runs once, then exits) ─────────────────────────────────────
    # Runs migrations before the API starts. The api service waits for this to
    # succeed via the depends_on condition.
    migrate:
        build:
            context: .
            dockerfile: Dockerfile
            target: production
        container_name: sisms_migrate
        command: npx prisma migrate deploy --schema=./prisma/schema
        depends_on:
            postgres:
                condition: service_healthy
        environment:
            DATABASE_URL: postgresql://${POSTGRES_USER:-sisms}:${POSTGRES_PASSWORD:-sisms_secret}@postgres:5432/${POSTGRES_DB:-sisms_db}
        restart: "no" # run once and exit — Docker Compose handles the sequencing
        networks:
            - sisms_net
